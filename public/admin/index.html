<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Alcance Isleño</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/admin/admin.css">
</head>
<body>

<!-- Pantalla de acceso -->
<main id="vista-login" class="login" hidden>
  <form id="form-login" class="tarjeta">
    <h1>Alcance Isleño</h1>
    <p class="suave">Panel interno</p>
    <label>Email <input type="email" name="email" autocomplete="username" required></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <p class="error" id="login-error" role="alert" hidden></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
</main>

<!-- Aplicación -->
<div id="vista-app" hidden>
  <header class="barra">
    <strong>Alcance Isleño</strong>
    <nav role="tablist">
      <button role="tab" data-tab="leads" aria-selected="true">Leads</button>
      <button role="tab" data-tab="clientes">Clientes</button>
      <button role="tab" data-tab="tarjetas">Tarjetas NFC</button>
    </nav>
    <span class="usuario"><span id="usuario-email"></span> <button id="salir" class="enlace">Salir</button></span>
  </header>

  <main class="contenido">
    <section id="stats" class="stats" aria-label="Resumen"></section>

    <!-- LEADS -->
    <section data-panel="leads">
      <div class="filtros">
        <select id="leads-estado" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
        </select>
        <input id="leads-buscar" type="search" placeholder="Buscar nombre, teléfono, negocio…" aria-label="Buscar">
      </div>
      <div id="leads-lista" class="lista"></div>
    </section>

    <!-- CLIENTES -->
    <section data-panel="clientes" hidden>
      <form id="form-cliente" class="tarjeta en-linea">
        <h2>Nuevo cliente</h2>
        <input name="name" placeholder="Nombre del negocio *" required maxlength="120">
        <input name="business_type" placeholder="Tipo de negocio" maxlength="80">
        <input name="contact_name" placeholder="Persona de contacto" maxlength="80">
        <input name="phone" placeholder="Teléfono" maxlength="30">
        <input name="email" type="email" placeholder="Email" maxlength="120">
        <button class="btn" type="submit">Crear</button>
      </form>
      <div id="clientes-lista" class="lista"></div>
    </section>

    <!-- TARJETAS -->
    <section data-panel="tarjetas" hidden>
      <form id="form-tarjeta" class="tarjeta en-linea">
        <h2>Nueva tarjeta NFC</h2>
        <select name="client_id" required aria-label="Cliente"></select>
        <input name="target_url" type="url" required placeholder="https://g.page/r/…/review *" maxlength="500">
        <input name="label" placeholder="Etiqueta (p. ej. Mostrador)" maxlength="80">
        <input name="slug" placeholder="Enlace personalizado (opcional)" pattern="[a-z0-9-]{3,40}" maxlength="40">
        <button class="btn" type="submit">Crear</button>
      </form>
      <p class="ayuda">Graba en la tarjeta NFC el enlace <code>/r/…</code> que aparece en cada fila, nunca la URL de Google directamente: así podrás cambiar el destino y ver cuántas veces se usa.</p>
      <div id="tarjetas-lista" class="lista"></div>
    </section>

    <p id="aviso" class="aviso" role="status" hidden></p>
  </main>
</div>

<script src="/assets/admin/admin.js" defer></script>
</body>
</html>
